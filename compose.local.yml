services:
  api:
    # Keep locally built images separate from the upstream GHCR `latest` tag. A later
    # `docker compose pull` can therefore never overwrite the image built from this checkout.
    image: opengym-api:local
    pull_policy: never
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    build:
      args:
        VERSION: ${LOCAL_BUILD_VERSION:-local}
        VCS_REF: ${LOCAL_GIT_SHA:-dirty}
        BUILD_DATE: ${LOCAL_BUILD_DATE:-unknown}
        # Docker Hub is often unreachable from this host. Public ECR mirrors the Docker Official
        # Node image, while the NGINX project publishes its unprivileged image there directly.
        NODE_IMAGE: ${LOCAL_NODE_IMAGE:-public.ecr.aws/docker/library/node:22.23.4-alpine}

  web:
    image: opengym-web:local
    pull_policy: never
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${NGINX_PORT:-80}/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    build:
      args:
        VERSION: ${LOCAL_BUILD_VERSION:-local}
        VCS_REF: ${LOCAL_GIT_SHA:-dirty}
        BUILD_DATE: ${LOCAL_BUILD_DATE:-unknown}
        NODE_IMAGE: ${LOCAL_NODE_IMAGE:-public.ecr.aws/docker/library/node:22.23.4-alpine}
        NGINX_IMAGE: ${LOCAL_NGINX_IMAGE:-public.ecr.aws/nginx/nginx-unprivileged:1.30.6-alpine}
        APP_BUILD: ${LOCAL_GIT_SHA:-dirty}
